<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">✦</span><span>Converse</span></div>
        <button class="new-chat" id="new-chat" type="button"><span>＋</span> New conversation</button>
        <div class="history-label">Your conversations</div>
        <nav class="history" id="history" aria-label="Conversation history"></nav>
      </aside>
      <section class="chat-panel">
        <header class="topbar">
          <div><p class="eyebrow">AI CHAT ASSISTANT</p><h1 id="conversation-title">Start a conversation</h1></div>
          <div class="tone-control" role="group" aria-label="Response tone">
            <span class="tone-label">Tone</span>
            <button class="tone active" data-tone="professional" type="button">Professional</button>
            <button class="tone" data-tone="casual" type="button">Casual</button>
            <button class="tone" data-tone="concise" type="button">Concise</button>
          </div>
        </header>
        <div class="conversation" id="conversation" aria-live="polite">
          <div class="empty-state" id="empty-state"><div class="orb">✦</div><h2>How can I help?</h2><p>Select a tone, then ask anything. Your conversation will be saved here.</p></div>
        </div>
        <form class="composer" id="composer">
          <label class="sr-only" for="prompt">Message</label>
          <textarea id="prompt" rows="1" placeholder="Message the assistant…" autocomplete="off"></textarea>
          <button id="send" type="submit" aria-label="Send message"><span>↑</span></button>
        </form>
        <p class="status" id="status"></p>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
